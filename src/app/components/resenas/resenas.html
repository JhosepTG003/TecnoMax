<section id="resenas" class="my-5">
  <h2 class="mb-3">Reseñas</h2>
  <div class="row g-3">
    @for (r of resenas; track r.autor) {
      <div class="col-md-4">
        <div class="card p-3 h-100">
          <div>{{ r.estrellas }}</div>
          <p class="my-2">"{{ r.texto }}"</p>
          <small class="text-muted">— {{ r.autor }}</small>
        </div>
      </div>
    }
  </div>
</section>
